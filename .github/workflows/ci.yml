name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check
      - run: ruff format --check
      - run: mypy app
      - run: pytest
      - name: OpenAPI schema is up to date
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi.json

  e2e:
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e apps/api
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Smoke tests (mock mode)
        run: npm run test:e2e
        working-directory: apps/web
      - name: Full-stack tests
        working-directory: apps/web
        env:
          NEXT_PUBLIC_USE_MOCKS: "false"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          E2E_STACK: "1"
          E2E_BASE_URL: http://localhost:3100
          LETS_ANALYZE_THINK_MS: "100"
        run: |
          (cd ../api && python -m uvicorn app.main:app --port 8000 &)
          npm run build
          (npx next start -p 3100 &)
          npx wait-on http://localhost:8000/v1/health http://localhost:3100
          npm run test:e2e:stack
