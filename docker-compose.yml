services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      LETS_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - lets-data:/data
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        # Browser-facing URL of the API (inlined at build time).
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_USE_MOCKS: "false"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lets-data:
